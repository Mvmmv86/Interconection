version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: interconection-postgres
    environment:
      POSTGRES_USER: interconection
      POSTGRES_PASSWORD: interconection123
      POSTGRES_DB: interconection
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interconection"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: interconection-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
